<style>
  :root{--paper:#F6F4EF;--green:#0E3A2C;--euc:#2A957F;--ink:#16271F;--muted:#6b7b73}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:'Hanken Grotesk',-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0}
  header{width:100%;background:var(--green);padding:18px 28px;display:flex;justify-content:space-between;align-items:center}
  .logo{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:22px;color:#eaf3ef}
  .logo span{color:var(--euc)}
  .tag{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#9fc3b6}
  .card{width:100%;max-width:520px;padding:40px 28px 48px;text-align:center}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:32px;line-height:1.15;margin:24px 0 10px;color:var(--green)}
  .sub{color:var(--muted);font-size:16px;line-height:1.55;margin-bottom:32px}
  /* MailerLite form overrides */
  .ml-embedded{text-align:left}
  .ml-embedded .ml-form-embedWrapper{background:transparent !important;border:none !important;padding:0 !important}
  .ml-embedded .ml-form-embedBody{padding:0 !important}
  .ml-embedded input,.ml-embedded select{border:1.5px solid #d4cfc6 !important;border-radius:10px !important;padding:12px 14px !important;font-family:'Hanken Grotesk',sans-serif !important;font-size:15px !important;background:#fff !important;width:100% !important;margin-bottom:12px !important}
  .ml-embedded input:focus,.ml-embedded select:focus{border-color:var(--euc) !important;outline:none !important}
  .ml-embedded .ml-form-embedSubmit button{background:var(--euc) !important;color:#fff !important;border:none !important;border-radius:999px !important;padding:14px 32px !important;font:600 16px 'Hanken Grotesk',sans-serif !important;cursor:pointer !important;width:100% !important;margin-top:4px !important}
  .ml-embedded .ml-form-successBody{text-align:center;padding:24px 0}
  footer{margin-top:auto;padding:24px;font-size:12px;color:var(--muted);text-align:center}
</style>

<body>
  <header>
    <div class="logo">H<span>o</span>p<span>O</span>n</div>
    <div class="tag">Investor Update</div>
  </header>
  <div class="card">
    <h1>Join the list.</h1>
    <p class="sub">One email a month. Real progress only.</p>
    <div class="ml-embedded" data-form="GluUOU"></div>
  </div>
  <footer>HopOn — within the Voltaire Group</footer>
