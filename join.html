<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join HopOn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Hanken+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#F6F4EF;font-family:'Hanken Grotesk',-apple-system,sans-serif;color:#16271F;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0}
  header{width:100%;background:#0e3a2c;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
  .logo{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:20px;color:#eaf3ef}
  .logo span{color:#2A957F}
  .tag{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#9fc3b6}
  .card{width:100%;max-width:480px;padding:36px 28px 44px}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:28px;color:#0e3a2c;margin:20px 0 8px;line-height:1.2}
  .sub{color:#6b7b73;font-size:15px;line-height:1.55;margin-bottom:28px}
  label{display:block;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#0e3a2c;margin-bottom:6px;margin-top:16px}
  input, select{width:100%;border:1.5px solid #d4cfc6;border-radius:10px;padding:12px 14px;font-family:'Hanken Grotesk',sans-serif;font-size:15px;background:#fff;color:#16271F;appearance:none}
  input:focus, select:focus{border-color:#2A957F;outline:none}
  .btn{margin-top:22px;width:100%;background:#2A957F;color:#fff;border:none;border-radius:999px;padding:14px;font-family:'Hanken Grotesk',sans-serif;font-size:16px;font-weight:600;cursor:pointer}
  footer{margin-top:auto;padding:20px;font-size:11px;color:#6b7b73;text-align:center}
</style>
</head>
<body>
<header>
  <div class="logo">H<span>o</span>p<span>O</span>n</div>
  <div class="tag">Investor Update</div>
</header>
<div class="card">
  <h1>Join the list.</h1>
  <p class="sub">One email a month. Real progress only.</p>
  <form id="f">
    <label>First name</label>
    <input type="text" id="fn" placeholder="Hippolyte" required>
    <label>Last name</label>
    <input type="text" id="ln" placeholder="Réchard" required>
    <label>Email</label>
    <input type="email" id="em" placeholder="you@email.com" required>
    <label>Preferred channel</label>
    <select id="ch">
      <option value="Email">Email</option>
      <option value="WhatsApp">WhatsApp</option>
      <option value="Text">Text</option>
      <option value="LinkedIn">LinkedIn</option>
    </select>
    <label>WhatsApp / phone (optional)</label>
    <input type="tel" id="ph" placeholder="+1 (352) 000-0000">
    <button class="btn" type="button" onclick="sub()">Join HopOn</button>
  </form>
</div>
<footer>HopOn — within the Voltaire Group</footer>
<script>
function sub(){
  var fn=document.getElementById('fn').value.trim();
  var ln=document.getElementById('ln').value.trim();
  var em=document.getElementById('em').value.trim();
  var ch=document.getElementById('ch').value;
  var ph=document.getElementById('ph').value.trim();
  if(!fn||!em){alert('Please fill in your first name and email.');return;}
  var body='New HopOn subscriber:\n\nName: '+fn+' '+ln+'\nEmail: '+em+'\nPreferred channel: '+ch+(ph?'\nPhone/WhatsApp: '+ph:'')+'\n\n---\nAdd to MailerLite: Prospects & Network group';
  window.location.href='mailto:hippolyte.rechard@groupevoltaire.com?subject='+encodeURIComponent('Join HopOn — '+fn+' '+ln)+'&body='+encodeURIComponent(body);
}
</script>
</body>
</html>
